<body>

        <section class="login">

                <h2>login Page</h2>

                <div class="labelline3">Enter Your Gmail</div>

                <img src="static/image/eye.png" id="eye">

    <script>

        let eye = document.getElementById("eye");
        let password = document.getElementById("password");

        eye.onclick = function(){
            if(password.type == "password"){
                password.type = "text";
            }
            else{
                password.type = "password";
            }
        }

    </script>
